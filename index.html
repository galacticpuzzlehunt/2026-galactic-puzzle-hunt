<style>
body {
  --hero-unit: min(8px, 1vw);
  min-height: calc(100vh - 3 * var(--body-padding));
  margin-bottom: var(--body-padding);
  justify-content: center;
}

#title, #title-scaling {
  background: var(--red-60);
  background-clip: text;
  color: transparent;
  margin: 0;
  position: absolute;
  font-family: var(--accent-font-2);
  width: max-content;
  filter:
    drop-shadow(-0.25px -0.25px 0 var(--red-50))
    drop-shadow( 0.25px -0.25px 0 var(--red-50))
    drop-shadow(-0.25px  0.25px 0 var(--red-50))
    drop-shadow( 0.25px  0.25px 0 var(--red-50));
}

#title-scaling {
  visibility: hidden;
}

#cup {
  filter: drop-shadow(calc(var(--hero-unit) * -2) calc(var(--hero-unit) * 5.5) calc(var(--hero-unit) / 4) #0008);
  position: relative;
  display: inline-block;
  z-index: 1;
  margin-top: 1em;
  translate: clamp(-240px, calc(480px - 60vw), 0px);
  pointer-events: none;

  img {
    width: calc(var(--hero-unit) * 70);
  }

  #coffee {
    --coffee-color: #2c1613;
    position: absolute;
    border-radius: 50% / 60% 60% 40% 40%;
    background-color: var(--coffee-color);
    inset: 10% 8% 54% 24%;
    mask: radial-gradient(black 65%, transparent 85%);
    cursor: grab;
    pointer-events: initial;

    .ripple {
      position: absolute;
      background-image: repeating-radial-gradient(
        transparent, oklch(from var(--coffee-color) calc((l + 1) / 2) c h / 0.5) 20%,
        transparent 20px
      );
      translate: -50% -50%;
      border-radius: 50%;
      animation: ripple 2s ease-out;
      pointer-events: none;
      filter: blur(2px);
    }
  }
}

@keyframes ripple {
  from {
    width: 0;
    height: 0;
    opacity: 0.5;
  }

  to {
    width: 200%;
    height: 240%;
    opacity: 0;
  }
}

#pad {
  filter: drop-shadow(calc(var(--hero-unit) * -0.2) calc(var(--hero-unit) * 1.2) #0008);
  position: relative;
  display: inline-block;
  margin-top: clamp(-400px, calc(800px - 100vw), 0px);
  translate: clamp(0px, calc(90vw - 720px), 240px);

  img {
    width: calc(var(--hero-unit) * 70);
    pointer-events: none;
  }

  #calendar {
    --day-width: calc(var(--hero-unit) * 10);
    --day-height: calc(var(--day-width) * 42 / (7 + 35));
    font-size: calc(var(--day-height) / 2);
    line-height: calc(var(--day-height) - 2px);
    white-space: nowrap;
    position: absolute;
    top: 0;
    transform: perspective(calc(var(--hero-unit) * 50)) rotateX(5deg) rotateY(-2.5deg) rotateZ(5.5deg) scale(0.75, 0.65);

    .day {
      display: inline-block;
      width: calc(var(--day-width) - 2px);
      border: 2px solid var(--neutral-20);
      margin: -1px;
      text-align: center;
      color: var(--neutral-60);

      &.in-month {
        color: var(--neutral-40);
      }
    }

    .in-hunt {
      border: 8px solid rgb(from var(--red-40) r g b / 0.8);
      margin: -8px;
      border-radius: var(--day-width);
      position: relative;
      z-index: 0;
      pointer-events: none;

      .day {
        position: relative;
        z-index: -1;
        pointer-events: initial;
      }

      time:hover {
        background-color: rgb(from var(--red-40) r g b / 0.2);
      }
    }

    .label {
      position: absolute;
      color: var(--red-40);
      font-family: Knewave, cursive;
      -webkit-text-stroke: 2px var(--red-90);
      left: 0.1em;
      bottom: 110%;
      font-size: max(1.5em, 24px);
    }

    #month {
      width: calc(var(--day-width) * 7);
      height: 2em;
      text-align: center;
      position: relative;

      &:hover, &:focus-within {
        text-decoration: underline;
      }

      #archive {
        position: absolute;
        inset: 0;
        border: none;
        opacity: 0;
        cursor: row-resize;
      }
    }
  }

  #rsvp {
    width: 4em;
    height: 4em;
    line-height: 4em;
    font-size: 1.25em;
    text-decoration: none;
    color: var(--red-90);
    border-radius: 50%;
    background-color: var(--red-20);
    position: absolute;
    left: -1.5em;
    bottom: 1.5em;
    font-family: var(--accent-font-2);
    transform: perspective(calc(var(--hero-unit) * 50)) rotateX(15deg) rotateY(-15deg) rotateZ(-25deg);
    transition: transform 0.1s;

    &:hover, &:focus {
      transform: perspective(calc(var(--hero-unit) * 50)) rotateX(5deg) rotateY(-5deg) rotateZ(-25deg);
      text-decoration: underline;
    }

    &:before {
      content: "";
      position: absolute;
      inset: 0.25em;
      border-radius: 50%;
      box-shadow: inset 0.1em -0.1em 2px -2px currentColor;
    }
  }
}
</style>

<script>
const scale = () => {
  const scaling = document.querySelector('#title-scaling');
  const title = document.querySelector('#title');
  if (window.innerWidth < 800) {
    scaling.innerText = "Galactic Puzzle Hunt";
    title.innerText = "Galactic Puzzle Hunt";
  } else {
    scaling.innerText = "Galactic Puzzle Hunt 2026";
    title.innerText = "Galactic Puzzle Hunt 2026";
  }
  const scalingW = scaling.getBoundingClientRect().width;
  const parentW = scaling.parentElement.getBoundingClientRect().width;
  const ratio = parentW / scalingW;
  title.style.fontSize = `${3.5 * ratio}em`;
};

window.addEventListener('resize', scale);
document.addEventListener('DOMContentLoaded', scale);
new ResizeObserver(scale).observe(document.getElementById('title-scaling'));

document.getElementById('coffee').addEventListener('click', evt => {
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = `${100 * evt.offsetX / evt.target.offsetWidth}%`;
  ripple.style.top = `${100 * evt.offsetY / evt.target.offsetHeight}%`;
  evt.target.append(ripple);
  setTimeout(() => ripple.remove(), 3000);
});
document.getElementById('archive').addEventListener('change', evt => {
  if (evt.target.value)
    window.location = `https://${evt.target.value}.galacticpuzzlehunt.com`;
});
</script>
